version: 0.1.0+1

environment:
  sdk: ^3.13.7

workspace:
  - packages/design_system
  - packages/design_system/widgetbook

dependencies:
  a2ui_core: ^0.5.0
  a2ui_flutter: ^0.1.0
  cupertino_ui: ^1.1.6
