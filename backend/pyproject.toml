[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Derek Alves", email = "derek.alves@avenue.us" }
]
requires-python = ">=3.14"
dependencies = [
    "a2ui-agent-sdk>=0.10,<0.11",
    "a2ui-core>=0.5,<0.6",
    "aiosqlite>=0.22",
    "fastapi[standard]>=0.162",
    "google-adk[db,openai]>=2.14,<3",
    "google-genai>=2.34,<3",
    "pydantic-settings>=2.16",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = ["e2e: chama Gemini real"]

[tool.ruff]
line-length = 100
target-version = "py314"
